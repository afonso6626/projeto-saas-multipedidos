<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Multipedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #EA1D2C; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #c01522; }
        h2 { color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Comece a Vender 🚀</h2>
        <p>Crie sua loja em 30 segundos</p>
        
        <form id="form-cadastro">
            <input type="text" id="nomeDono" placeholder="Seu Nome" required>
            <input type="text" id="nomeLoja" placeholder="Nome da Loja (Ex: Pizza Top)" required>
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="password" id="senha" placeholder="Crie uma Senha" required>
            <button type="submit">CRIAR LOJA GRÁTIS</button>
        </form>
    </div>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            btn.innerText = "Criando...";
            btn.disabled = true;

            const dados = {
                nomeDono: document.getElementById('nomeDono').value,
                nomeLoja: document.getElementById('nomeLoja').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                // AQUI A MÁGICA: O site pede para o servidor criar a loja
                const response = await fetch('/api/admin/criar-loja', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (resultado.sucesso) {
                    alert("🎉 Loja criada com sucesso! Faça login para começar.");
                    window.location.href = 'index.html'; // Manda para o login
                } else {
                    alert("Erro: " + resultado.erro);
                    btn.innerText = "Tentar Novamente";
                    btn.disabled = false;
                }

            } catch (error) {
                alert("Erro de conexão com o servidor.");
                btn.innerText = "Tentar Novamente";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
