<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/style.css">

    <!-- CSS PARA OS NOVOS ELEMENTOS -->
    <style>
        /* CSS DA NOTA DE TESTE (AMARELA) */
        .demo-note {
            background-color: #fff3cd;   /* Fundo amarelo claro */
            color: #856404;              /* Texto amarelo escuro/marrom */
            border: 1px solid #ffeeba;   /* Borda sutil */
            padding: 10px;               /* Espaçamento interno */
            border-radius: 8px;          /* Cantos arredondados */
            font-size: 0.85rem;          /* Fonte pequena */
            margin-bottom: 20px;         /* Empurra o formulário para baixo */
            text-align: center;          /* Centraliza o texto */
            line-height: 1.5;            /* Altura da linha para ler melhor */
        }
        
        .demo-note strong {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            display: block;              /* Quebra a linha depois do título */
            margin-bottom: 2px;
        }

        /* CSS DA ÁREA DE CADASTRO (LÁ EMBAIXO) */
        .signup-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .signup-area span {
            margin-right: 5px;
        }

        .signup-area a {
            color: var(--primary-color, #6c5ce7);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }

        .signup-area a:hover {
            text-decoration: underline;
            color: #5a4ad1;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader-container hidden">
        <div class="loader"></div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h2>Painel da Lanchonete - teste </h2>
            <p>Faça login para gerenciar seu negócio</p>

            <!-- AQUI ESTÁ A NOTINHA PARA TESTADORES -->
            <div class="demo-note">
                <strong>Acesso de Demonstração</strong>
                Email: <b>teste@gmail.com</b><br>
                Senha: <b>123456</b>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="loginButton" class="btn-primary" style="width: 100%;">Entrar</button>
                
                <div style="margin-top: 15px; text-align: center;">
                    <a href="#" id="btn-forgot-password" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">Esqueci minha senha</a>
                </div>

                <!-- ÁREA DE CADASTRO -->
                <div class="signup-area">
                    <span>Quer cadastrar sua loja?</span>
                    <a href="cadastro.html">Cadastre-se aqui</a>
                </div>

                <p id="error-message" class="error-message"></p>
            </form>
        </div>
    </div>

    <!-- MODAL DE RECUPERAÇÃO DE SENHA -->
    <div id="forgot-password-modal" class="modal-container hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Recuperar Senha</h2>
                <button class="close-modal-btn">&times;</button>
            </div>
            
            <form id="forgot-password-form">
                <div class="modal-body">
                    <p style="margin-bottom: 15px; color: var(--text-light);">Digite seu e-mail para receber um link de redefinição.</p>
                    <div class="form-group">
                        <label>Seu E-mail</label>
                        <input type="email" id="recovery-email" required class="form-control" placeholder="exemplo@email.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary cancel-modal-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Enviar Link</button>
                </div>
            </form>
        </div>
    </div>
 
    <!-- Scripts do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- Scripts Modulares -->
    <script type="module" src="admin/js/auth.js"></script>
    <script type="module" src="admin/js/ui.js"></script>
</body>
</html>
